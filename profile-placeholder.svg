<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 800" role="img" aria-labelledby="title description">
  <title id="title">Nitin Poonia initials</title>
  <desc id="description">A navy and orange placeholder portrait with the initials NP</desc>
  <defs>
    <linearGradient id="background" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#10243a"/><stop offset="1" stop-color="#06101b"/></linearGradient>
    <radialGradient id="glow"><stop stop-color="#ff6534" stop-opacity=".45"/><stop offset="1" stop-color="#ff6534" stop-opacity="0"/></radialGradient>
  </defs>
  <rect width="600" height="800" fill="url(#background)"/>
  <circle cx="480" cy="165" r="250" fill="url(#glow)"/>
  <circle cx="300" cy="360" r="180" fill="none" stroke="#43d7d0" stroke-opacity=".4" stroke-width="2"/>
  <circle cx="300" cy="360" r="220" fill="none" stroke="#ff6534" stroke-opacity=".3" stroke-width="2" stroke-dasharray="10 14"/>
  <text x="300" y="405" fill="#f2f6f8" font-family="Arial, sans-serif" font-size="155" font-weight="800" text-anchor="middle">NP</text>
  <text x="300" y="690" fill="#9babb9" font-family="Arial, sans-serif" font-size="20" letter-spacing="8" text-anchor="middle">NITIN POONIA</text>
</svg>
